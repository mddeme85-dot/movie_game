<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reel Quiz</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Reel Quiz</h1><nav>
  <button id="nav-play" class="tab active">Play</button>
  <button id="nav-edit" class="tab">Clips</button>
</nav></header>

<main>
<section id="view-play">
  <div id="screen-start">
    <p>Watch the clip. It pauses and asks a question. You have 15 seconds, and answering in the first 5 earns a speed bonus.</p>
    <fieldset>
      <legend>Mode</legend>
      <label class="radio"><input type="radio" name="mode" value="easy" checked> Easy: pick from four answers</label>
      <label class="radio"><input type="radio" name="mode" value="hard"> Hard: type or speak your answer</label>
    </fieldset>
    <label class="radio"><input type="checkbox" id="sound" checked> Countdown sound for the last 5 seconds</label>
    <label>Rounds <select id="rounds"><option>5</option><option>10</option><option>20</option></select></label>
    <button id="btn-start" class="primary">Start game</button>
    <p id="start-msg" class="muted"></p>
  </div>

  <div id="screen-game" hidden>
    <div class="status"><span id="st-round"></span><span id="st-score"></span></div>
    <div class="player-wrap">
      <div id="player"></div>
      <div id="mask-top" class="mask"></div>
      <div id="mask-bottom" class="mask"></div>
      <button id="tap" hidden>Tap to play</button>
      <div id="endcard" hidden>
        <h2 id="end-title"></h2>
        <p id="end-answer"></p>
        <p id="end-points"></p>
        <button id="btn-next" class="primary">Next</button>
      </div>
    </div>
    <p id="watch-msg" class="muted"></p>

    <div id="q-panel" hidden>
      <div class="timer"><div id="t-bar"></div></div>
      <div class="timer-row"><span id="t-bonus">Speed bonus available</span><span id="t-num"></span></div>
      <h2 id="q-prompt"></h2>
      <div id="q-options" hidden></div>
      <form id="a-form" hidden autocomplete="off">
        <input id="a-input" placeholder="Your answer" autocomplete="off">
        <button type="button" id="btn-mic" hidden>Speak</button>
        <button class="primary" type="submit">Answer</button>
      </form>
    </div>
  </div>

  <div id="screen-end" hidden>
    <h2 id="end-score"></h2>
    <button id="btn-again" class="primary">Play again</button>
  </div>
</section>

<section id="view-edit" hidden>
  <h2>Add a clip</h2>
  <form id="clip-form">
    <label>YouTube URL <input id="f-url" required placeholder="https://www.youtube.com/watch?v=..."></label>
    <div class="row">
      <label>Start (m:ss or seconds) <input id="f-start" required value="0:00"></label>
      <label>Ask question at <input id="f-pause" required value="0:15"></label>
      <label>Play until (optional) <input id="f-end" placeholder="blank = end of video"></label>
    </div>
    <label>Hide bottom % of video (optional, for burned-in subtitles) <input id="f-maskb" type="number" min="0" max="40" placeholder="0"></label>
    <label>Question type <select id="f-type"></select></label>
    <label>Question <input id="f-prompt" required></label>
    <label>Correct answer <input id="f-answer" required></label>
    <label>Also accept in Hard mode (optional, one per line) <textarea id="f-accept" rows="2"></textarea></label>
    <label>Wrong answers for Easy mode (one per line, 2 to 3) <textarea id="f-wrong" rows="3"></textarea></label>
    <button class="primary" type="submit">Save clip</button>
  </form>

  <h2>Clips <span id="clip-count" class="muted"></span></h2>
  <ul id="clip-list"></ul>
  <div class="row">
    <button id="btn-export">Export my clips (JSON)</button>
    <label class="btn">Import JSON <input id="f-import" type="file" accept=".json" hidden></label>
  </div>
</section>
</main>

<script src="questions.js"></script>
<script src="clips.js"></script>
<script src="game.js"></script>
</body>
</html>
